name: my_dev release

on:
  workflow_dispatch:
    inputs:
      policy_origin:
        description: 'Mandatory-update HTTPS origin with no path (placeholder is fine for a personal unsigned build)'
        type: string
        default: https://my-dev.invalid
        required: true
      login_origins:
        description: 'Comma-separated login origins for the Windows build; defaults to the policy origin'
        type: string
        required: false
      npm_targets:
        description: 'Comma-separated npm single-executable targets; empty builds all five'
        type: string
        default: node24-linux-x64,node24-linux-arm64,node24-macos-arm64,node24-macos-x64,node24-win-x64
        required: false
      npm_dist_tag:
        description: 'npm dist-tag for @banzhe/dsh-banzhe'
        type: string
        default: latest
        required: false
  push:
    branches: [my_dev]

permissions:
  contents: write

concurrency:
  group: my-dev-electron-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub Releases are per-tag, and both platforms derive the same version from one
  # checkout, so each job checks whether its release exists and reuses it otherwise.
  release-windows:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/my_dev'
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          clean: true
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare unsigned Windows package settings
        id: settings
        env:
          PACKAGE_POLICY_ORIGIN: ${{ github.event_name == 'workflow_dispatch' && inputs.policy_origin || 'https://my-dev.invalid' }}
          PACKAGE_LOGIN_ORIGINS: ${{ github.event_name == 'workflow_dispatch' && inputs.login_origins || '' }}
        run: node .github/workflows/prepare-my-dev-windows.mjs
      - name: Build unsigned Windows installer
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
          DSH_DESKTOP_GITHUB_RELEASE_FEED: '1'
          DSH_DESKTOP_GITHUB_REPOSITORY: ${{ github.repository }}
        run: pnpm run package:desktop:win:x64:unsigned --build-version "$env:PACKAGE_VERSION"
      - name: Point update metadata at GitHub Releases
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $metadata = Get-Item "apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/nightly.yml"
          node --input-type=module -e "import { readFileSync, writeFileSync } from 'node:fs'; import { githubReleaseMetadata } from './.github/workflows/prepare-my-dev-windows.mjs'; const path = process.argv[1]; writeFileSync(path, githubReleaseMetadata(readFileSync(path, 'utf8'), process.env.RELEASE_REPOSITORY))" $metadata.FullName
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          if (gh release view $env:PACKAGE_VERSION --repo $env:GITHUB_REPOSITORY > $null 2>&1) {
            Write-Host "Release $env:PACKAGE_VERSION exists; uploading this installer into it"
          } else {
            gh release create $env:PACKAGE_VERSION `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title $env:PACKAGE_VERSION `
              --latest `
              --notes "Unsigned Electron build from my_dev at $($env:GITHUB_SHA). Windows installs update from the latest GitHub Release; install the macOS DMG manually."
          }
          gh release upload $env:PACKAGE_VERSION `
            (Get-Item "apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe").FullName `
            (Get-Item "apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe.blockmap").FullName `
            (Get-Item "apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/nightly.yml").FullName `
            --repo $env:GITHUB_REPOSITORY --clobber
      - name: Remove generated package settings
        if: always()
        run: |
          if (Test-Path -LiteralPath apps/desktop/.env.windows) {
            Remove-Item -LiteralPath apps/desktop/.env.windows
          }

  release-macos-arm64:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/my_dev'
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          clean: true
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve build version
        id: settings
        run: node .github/workflows/prepare-my-dev-macos.mjs
      - name: Build unsigned macOS arm64 DMG
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: pnpm run package:desktop:mac:arm64:unsigned --build-version "$PACKAGE_VERSION"
      # The Windows job tags builds with the same version format, so the release may already
      # exist; both platforms' assets then share one release and the last publish wins --latest.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          if gh release view "$PACKAGE_VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $PACKAGE_VERSION exists; uploading this DMG into it"
          else
            gh release create "$PACKAGE_VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$PACKAGE_VERSION" \
              --latest \
              --notes "Unsigned Electron build from my_dev at $GITHUB_SHA. Windows installs update from the latest GitHub Release; install the macOS DMG manually."
          fi
          gh release upload "$PACKAGE_VERSION" \
            "apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/deepseek-harness-$PACKAGE_VERSION-mac-arm64-unsigned.dmg" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  # npm single-executable distribution. Both the GitHub Release and this package family ship
  # from one run at one version: `scripts/build-npm-exe.ts` renames the single executable that
  # `scripts/build-exe-for-python-sdk.ts` produces into `@banzhe/dsh-banzhe-<os>-<arch>`, and
  # `scripts/publish-npm-exe.ts` publishes those platform packages before the launcher.
  npm-plan:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/my_dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      complete: ${{ steps.plan.outputs.complete }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: Compute matrix from targets input
        id: plan
        env:
          # Blank dispatch inputs build all targets.
          TARGETS: ${{ inputs.npm_targets }}
        run: |
          set -euo pipefail
          targets="${TARGETS:-node24-linux-x64,node24-linux-arm64,node24-macos-arm64,node24-macos-x64,node24-win-x64}"
          matrix='[]'
          IFS=',' read -r -a list <<< "$targets"
          for raw in "${list[@]}"; do
            t="$(echo "$raw" | xargs)" # trim surrounding whitespace
            [ -z "$t" ] && continue
            # Native-only: hosted arm64 Linux uses ubuntu-24.04-arm, while
            # macos-latest is Apple Silicon; macos-15-intel is native x64.
            case "$t" in
              node24-linux-x64)   runner=ubuntu-latest;    suffix=linux-x64 ;;
              node24-linux-arm64) runner=ubuntu-24.04-arm; suffix=linux-arm64 ;;
              node24-macos-arm64) runner=macos-latest;     suffix=darwin-arm64 ;;
              node24-macos-x64)   runner=macos-15-intel;   suffix=darwin-x64 ;;
              node24-win-x64)     runner=windows-2025;     suffix=win32-x64 ;;
              *)
                echo "::error::Unknown npm target '$t'. Supported: node24-linux-x64, node24-linux-arm64, node24-macos-arm64, node24-macos-x64, node24-win-x64."
                exit 1
                ;;
            esac
            matrix="$(jq -c --arg target "$t" --arg runner "$runner" --arg suffix "$suffix" '. + [{target: $target, runner: $runner, suffix: $suffix}]' <<< "$matrix")"
          done
          if [ "$matrix" = '[]' ]; then
            echo "::error::The npm_targets input selected nothing to build."
            exit 1
          fi
          echo "Matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          # Publishing needs every platform package; a partial dispatch still builds and
          # smokes what it selected but leaves the registry alone.
          echo "complete=$([ "$(jq 'length' <<< "$matrix")" = '5' ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  npm-exe:
    needs: npm-plan
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/my_dev'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.npm-plan.outputs.matrix) }}
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_BUILD_CLIENT_PROFILE: official
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          clean: true
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        # node-gyp fetches Node headers from nodejs.org during install, which stalls
        # intermittently; bounded retries mirror the existing exe workflow's policy.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then exit 0; fi
            [ "$attempt" -lt 3 ] && sleep 10
          done
          exit 1
      - name: Resolve release version
        id: version
        # Reads the desktop build-version helper, which needs the installed dependency tree.
        run: node .github/workflows/prepare-my-dev-npm.mjs
      - name: Resolve the embedded CLI version
        id: product
        # The packaged executable reports the dsh product version, which the npm package
        # version extends with the release's date and run identity.
        run: >-
          node -e "const fs=require('node:fs');const v=require('./apps/cli/package.json').version;fs.appendFileSync(process.env.GITHUB_OUTPUT,'product-version='+v+'\n')"
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.pkg-cache
          key: pkg-fetch-${{ matrix.target }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pkg-fetch-${{ matrix.target }}-
      - name: Rebuild Linux node-pty against manylinux 2.28
        if: runner.os == 'Linux'
        env:
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64) image=quay.io/pypa/manylinux_2_28_x86_64 ;;
            ARM64) image=quay.io/pypa/manylinux_2_28_aarch64 ;;
            *) echo "::error::Unsupported Linux runner architecture $RUNNER_ARCH"; exit 1 ;;
          esac
          addon_dir="$(realpath packages/subprocess/subprocess-local/node_modules/node-pty)"
          pnpm_setup_root="$(realpath "$(dirname "$(dirname "$PNPM_HOME")")")"
          # Verification installs would install node-gyp inside the package and package it into the exe.
          (cd "$addon_dir" && npm_config_build_from_source=true pnpm --config.verifyDepsBeforeRun=false run install)
          addon="$addon_dir/build/Release/pty.node"
          [ -f "$addon_dir/build/Makefile" ] || {
            echo "::error::node-pty install did not generate $addon_dir/build/Makefile"
            exit 1
          }
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:$PWD" \
            -v "$HOME/.cache/node-gyp:$HOME/.cache/node-gyp:ro" \
            -v "$pnpm_setup_root:$pnpm_setup_root:ro" \
            -w "$addon_dir" \
            "$image" \
            bash -euxo pipefail -c \
              'rm -rf build/Release && make -C build -j2 BUILDTYPE=Release'
          [ -f "$addon" ] || { echo "::error::$addon missing after manylinux rebuild"; exit 1; }
          readelf --version-info "$addon" | tee node-pty-glibc-versions.txt
          maximum="$(sed -n 's/.*Name: GLIBC_\([0-9.]*\).*/\1/p' node-pty-glibc-versions.txt | sort -V | tail -1)"
          [ -n "$maximum" ] || { echo "::error::No GLIBC requirements found in $addon"; exit 1; }
          dpkg --compare-versions "$maximum" le 2.28 || {
            echo "::error::node-pty addon requires GLIBC_$maximum but the wheel-level floor is manylinux 2.28"
            exit 1
          }
      - name: Build the npm single-executable packages
        run: >-
          pnpm exec tsx scripts/build-npm-exe.ts --targets=${{ matrix.target }}
          --version=${{ steps.version.outputs.version }}
      - name: Smoke the packed executable (POSIX)
        if: runner.os != 'Windows'
        env:
          SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ steps.version.outputs.version }}
          PRODUCT_VERSION: ${{ steps.product.outputs.product-version }}
        run: |
          set -euo pipefail
          artifacts="$PWD/dist-exe/npm"
          consumer="$RUNNER_TEMP/npm-exe-consumer"
          mkdir -p "$consumer" "$RUNNER_TEMP/npm-exe-home"
          cd "$consumer"
          npm init --yes > /dev/null
          # --omit=optional keeps the entry package from fetching its platform range from the
          # registry before this run has published anything; the platform tarball is installed
          # directly instead.
          npm install --omit=optional --no-audit --no-fund \
            "file:$artifacts/banzhe-dsh-banzhe-$VERSION.tgz" \
            "file:$artifacts/banzhe-dsh-banzhe-$SUFFIX-$VERSION.tgz"
          bin="$consumer/node_modules/.bin/dsh-banzhe"
          version="$(DSH_HOME="$RUNNER_TEMP/npm-exe-home" "$bin" --version)"
          echo "packaged version: $version"
          [ "$version" = "$PRODUCT_VERSION" ] || { echo "::error::packaged --version '$version' does not match $PRODUCT_VERSION"; exit 1; }
          DSH_HOME="$RUNNER_TEMP/npm-exe-home" "$bin" web --no-open --port 38471 > "$RUNNER_TEMP/web.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 120); do
            grep -q 'dsh web:' "$RUNNER_TEMP/web.log" && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat "$RUNNER_TEMP/web.log"
          grep -q 'dsh web:' "$RUNNER_TEMP/web.log" || { echo "::error::dsh-banzhe web reported no URL"; exit 1; }
      - name: Smoke the packed executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ steps.version.outputs.version }}
          PRODUCT_VERSION: ${{ steps.product.outputs.product-version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifacts = Join-Path $PWD 'dist-exe/npm'
          $consumer = Join-Path $env:RUNNER_TEMP 'npm-exe-consumer'
          # `$home` is PowerShell's read-only $HOME; the harness home is a separate name.
          $dshHome = Join-Path $env:RUNNER_TEMP 'npm-exe-home'
          New-Item -ItemType Directory -Force -Path $consumer, $dshHome | Out-Null
          Set-Location $consumer
          npm init --yes | Out-Null
          npm install --omit=optional --no-audit --no-fund `
            "file:$artifacts/banzhe-dsh-banzhe-$env:VERSION.tgz" `
            "file:$artifacts/banzhe-dsh-banzhe-$env:SUFFIX-$env:VERSION.tgz"
          $shim = Join-Path $consumer 'node_modules/.bin/dsh-banzhe.cmd'
          $version = "$(& $shim --version | Select-Object -Last 1)".Trim()
          Write-Host "packaged version: $version"
          if ($version -ne $env:PRODUCT_VERSION) {
            Write-Error "packaged --version '$version' does not match $env:PRODUCT_VERSION"
          }
      - name: Upload the packed packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: npm-exe-${{ matrix.suffix }}
          path: |
            dist-exe/npm/*.tgz
            dist-exe/npm/npm-exe-manifest-*.json
          if-no-files-found: error
          retention-days: 7

  npm-publish:
    needs: [npm-plan, npm-exe]
    if: >-
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/my_dev')
      && needs.npm-plan.outputs.complete == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-publish
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: npm-exe-*
          path: dist-exe/npm
          merge-multiple: true
      - name: Publish @banzhe/dsh-banzhe
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ inputs.npm_dist_tag || 'latest' }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::The NPM_TOKEN repository secret is required to publish the npm packages."
            exit 1
          fi
          npmrc="$RUNNER_TEMP/npm-exe-npmrc"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$npmrc"
          NPM_CONFIG_USERCONFIG="$npmrc" node scripts/publish-npm-exe.ts --dir=dist-exe/npm --dist-tag="$DIST_TAG"
      - name: Remove the temporary npm credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/npm-exe-npmrc"
